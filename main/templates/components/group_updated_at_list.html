{% load static %}
<div class="mt-1">
    <a data-bs-toggle="collapse" href="#groupsUpdatedCollapse" role="button" aria-expanded="false"
       aria-controls="groupsUpdatedCollapse" style="color:#380216; font-size: 15px;">
        Изменения по группам ▾
    </a>
    <div class="collapse" id="groupsUpdatedCollapse">
        <div class="card card-body shadow-sm" style="max-width: 560px; max-height: 340px; overflow-y: auto;">
            <input type="text" class="form-control form-control-sm mb-2" id="groupsUpdatedFilter"
                   placeholder="Фильтр по названию группы..." autocomplete="off">
            {% for form in groups_by_form %}
                <div class="fw-bold border-bottom groups-updated-form-label" style="color:#6f0724;">
                    {{ form.form_label }}
                </div>
                {% for group in form.groups %}
                    <div class="d-flex justify-content-between groups-updated-row" style="padding: 1px 4px;">
                        <span class="me-3">{{ group.title }}</span>
                        <span class="text-muted">{{ group.updated_at_display }}</span>
                    </div>
                {% endfor %}
            {% endfor %}
        </div>
    </div>
</div>
<script>
    function filterGroupsUpdatedList() {
        const input = document.getElementById('groupsUpdatedFilter');
        if (!input) return;
        const query = input.value.trim().toLowerCase();
        document.querySelectorAll('#groupsUpdatedCollapse .groups-updated-row').forEach(function (row) {
            // d-none, а не style.display: у строк есть класс d-flex (display:flex !important
            // в Bootstrap), который перебивает инлайновый display:none
            row.classList.toggle('d-none', !row.textContent.toLowerCase().includes(query));
        });
        document.querySelectorAll('#groupsUpdatedCollapse .groups-updated-form-label').forEach(function (label) {
            let visible = false;
            let node = label.nextElementSibling;
            while (node && !node.classList.contains('groups-updated-form-label')) {
                if (node.classList.contains('groups-updated-row') && !node.classList.contains('d-none')) {
                    visible = true;
                    break;
                }
                node = node.nextElementSibling;
            }
            label.classList.toggle('d-none', !visible);
        });
    }

    // привязка через addEventListener (надёжнее inline-oninput: срабатывает в т.ч.
    // при автозаполнении поля браузером) + начальная фильтрация, если поле не пусто
    (function () {
        const input = document.getElementById('groupsUpdatedFilter');
        if (!input) return;
        input.addEventListener('input', filterGroupsUpdatedList);
        input.addEventListener('change', filterGroupsUpdatedList);
        if (input.value) filterGroupsUpdatedList();
    })();
</script>
