<form method="get" class="d-flex gap-2 align-items-center mb-2" style="width: 420px;">
    <input type="text" name="q" value="{{ query }}" class="form-control form-control-sm"
           placeholder="{{ placeholder }}">
    <button type="submit" class="btn btn-danger btn-sm">Поиск</button>
    {% if query %}
    <a href="?" class="btn btn-outline-dark btn-sm">Сбросить</a>
    {% endif %}
</form>
