{% load static %}
<div style="width:1000px;">
    <table border="1" cellpadding="10" cellspacing="10" class="table table-hover">
        <thead>
        <tr>
            <th style="border-right: 1px solid; border-color: inherit;">Название</th>
            <th style="border-right: 1px solid; border-color: inherit;">Код</th>
            <th style="width: 110px;">Действия</th>
        </tr>
        </thead>
        <tbody>
        {% for faculty in faculties %}
        <tr>
            <td style="border-right: 1px solid; border-color: inherit;">
                {{ faculty.title }}
            </td>
            <td style="border-right: 1px solid; border-color: inherit;">
                {% if not faculty.code %}
                --
                {% else %}
                {{ faculty.code }}
                {% endif %}
            </td>
            <td>
                <a class="btn btn-outline-secondary btn-sm"
                   href="{% url 'edit_faculty' %}?id={{ faculty.id }}" title="Изменить">
                    <img src="{% static 'Images/gear.png' %}" height="17px" alt="Изменить">
                </a>
                <a class="btn btn-outline-danger btn-sm"
                   href="{% url 'delete_faculty' %}?id={{ faculty.id }}" title="Удалить">
                    <img src="{% static 'Images/delete.png' %}" height="17px" alt="Удалить">
                </a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
