<form method="get" class="live-search-form d-flex gap-2 align-items-center mb-2" style="width: 420px;"
      autocomplete="off">
    <input type="text" name="q" value="{{ query }}" class="form-control form-control-sm"
           placeholder="{{ placeholder }}">
    <button type="submit" class="btn btn-danger btn-sm">Поиск</button>
    <a href="." class="btn btn-outline-dark btn-sm live-search-reset {% if not query %}d-none{% endif %}"
       onclick="liveSearchReset(event)">Сбросить</a>
</form>
<script>
    // Посимвольный поиск: с задержкой 350 мс после ввода страница тихо догружается
    // и в #searchResultsArea подставляется свежая таблица с результатами (без
    // перезагрузки — фокус и позиция курсора в поле сохраняются).
    function liveSearchReset(event) {
        const input = event.target.closest('form').querySelector('input[name="q"]');
        if (input) input.value = '';
        event.target.classList.add('d-none');
        history.replaceState(null, '', location.pathname);
        applyLiveSearch('');
    }

    function applyLiveSearch(query) {
        const area = document.getElementById('searchResultsArea');
        if (!area) return;
        const url = location.pathname + (query ? '?q=' + encodeURIComponent(query) : '');
        window.__liveSearchSeq = (window.__liveSearchSeq || 0) + 1;
        const token = window.__liveSearchSeq;
        fetch(url)
            .then(r => r.text())
            .then(html => {
                if (token !== window.__liveSearchSeq) return; // пришёл более свежий запрос
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const fresh = doc.getElementById('searchResultsArea');
                if (fresh) area.innerHTML = fresh.innerHTML;
                history.replaceState(null, '', url);
            })
            .catch(err => console.error('Ошибка живого поиска:', err));
    }

    (function () {
        document.querySelectorAll('form.live-search-form').forEach(function (form) {
            const input = form.querySelector('input[name="q"]');
            if (!input) return;
            let timer = null;
            input.addEventListener('input', function () {
                form.querySelector('.live-search-reset')
                    ?.classList.toggle('d-none', input.value.trim() === '');
                clearTimeout(timer);
                timer = setTimeout(function () {
                    applyLiveSearch(input.value.trim());
                }, 350);
            });
        });
    })();
</script>
